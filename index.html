<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meowmd - a tiny markdown viewer + editor</title>
    <meta name="description" content="a tiny markdown viewer + editor that autosaves in your browser.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 8l4-4v4M27 8l-4-4v4' fill='%2343ABE5'/%3E%3Ccircle cx='16' cy='19' r='11' fill='%2343ABE5'/%3E%3Ccircle cx='12' cy='20' r='1.6' fill='%2311111B'/%3E%3Ccircle cx='20' cy='20' r='1.6' fill='%2311111B'/%3E%3Cpath d='M12 24.5c1.2 1.1 2.8 1.1 4 0' stroke='%2311111B' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <!-- vendored, pinned: marked 9.1.2, marked-footnote 1.4.0, mermaid 11.16.1 (lazy-loaded by script.js), dompurify 3.2.4, prism 1.29.0. loaded before first-party js -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/marked-footnote.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/prism/prism-core.min.js"></script>
    <script src="vendor/prism/prism-autoloader.min.js"></script>
    <script src="vendor/prism/components/prism-markup.min.js"></script>
    <script src="vendor/prism/components/prism-markdown.min.js"></script>
    <script src="vendor/prism/components/prism-clike.min.js"></script>
    <script src="vendor/prism/components/prism-c.min.js"></script>
    <script src="vendor/prism/components/prism-objectivec.min.js"></script>
    <script src="vendor/prism/components/prism-fsharp.min.js"></script>
    <script src="vendor/prism/components/prism-visual-basic.min.js"></script>
    <script>
        const saved = localStorage.getItem('cloudy-theme');
        if (saved) document.documentElement.dataset.theme = saved;
    </script>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="cursor.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden="" aria-hidden="true">
  <!-- icon sprite. Paste this whole element into <body> as its first
       child, then reach an icon with <use href="#i-name"/>.

       Drawing contract, on every symbol: viewBox 0 0 16 16, fill none, stroke
       currentColor, stroke-width 1.5, round caps, round joins. The round join
       is the corner treatment: every corner in the set gets the same 0.75-unit
       outer radius from it, so no path carries an rx of its own.

       Grid: a closed shape bounds 2..14 (a circle container r 6.5 at 8,8), an
       open stroke runs 3..13, a chevron arm is 5 on each axis, a dot is a
       0.01-long round-capped segment. -->

  <!-- marks -->
  <symbol id="i-minus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h10"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v10M3 8h10"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.75 8.25L6.5 12L13.25 4"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4L12 12M12 4L4 12"/>
  </symbol>

  <!-- chevrons: arm 5 on each axis, apex 2.5 off centre -->
  <symbol id="i-chevron-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 5.5L8 10.5L13 5.5"/>
  </symbol>
  <symbol id="i-chevron-up" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5L8 5.5L13 10.5"/>
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 3L10.5 8L5.5 13"/>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 3L5.5 8L10.5 13"/>
  </symbol>

  <!-- arrows: shaft 3..13, head arm 4 -->
  <symbol id="i-arrow-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h10M9 4L13 8L9 12"/>
  </symbol>
  <symbol id="i-arrow-left" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 8H3M7 4L3 8L7 12"/>
  </symbol>
  <symbol id="i-arrow-up" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 13V3M4 7L8 3L12 7"/>
  </symbol>
  <symbol id="i-arrow-down" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v10M4 9L8 13L12 9"/>
  </symbol>

  <!-- chrome -->
  <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.75" cy="6.75" r="4.75"/>
    <path d="M10.5 10.5L14 14"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 5.5H13.5M2.5 10.5H13.5"/>
    <circle cx="6" cy="5.5" r="1.75"/>
    <circle cx="10" cy="10.5" r="1.75"/>
  </symbol>
  <symbol id="i-bell" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 7.5a3.5 3.5 0 0 1 7 0v3l1.5 2h-10l1.5-2z"/>
    <path d="M6.5 12.5a1.5 1.5 0 0 0 3 0"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="5.25" r="2.5"/>
    <path d="M3.25 13.75a4.75 4.75 0 0 1 9.5 0"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 7h11v6.5h-11z"/>
    <path d="M5 7V5.25a3 3 0 016 0V7"/>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4.5H13.5M2.5 8H13.5M2.5 11.5H13.5"/>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2h4v4H2zM10 2h4v4h-4zM2 10h4v4H2zM10 10h4v4h-4z"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 13L5.5 8L8.5 11L14 3"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="3"/>
    <path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M4.8 4.8L3.75 3.75M11.2 4.8L12.25 3.75M4.8 11.2L3.75 12.25M11.2 11.2L12.25 12.25"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 8.8A6 6 0 1 1 7.2 2a4.8 4.8 0 0 0 6.8 6.8z"/>
  </symbol>

  <!-- files and code -->
  <symbol id="i-folder" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3.5h4l1.5 2H14v7H2z"/>
  </symbol>
  <symbol id="i-file" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 2.5H4v11h8V5z"/>
    <path d="M9.5 2.5V5H12"/>
  </symbol>
  <symbol id="i-code" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 4.5L2.5 8L5.5 11.5M10.5 4.5L13.5 8L10.5 11.5"/>
  </symbol>
  <symbol id="i-terminal" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 4.5L6.5 8L3 11.5M8.5 12H13"/>
  </symbol>
  <symbol id="i-console" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 2.5h11v11h-11z"/>
    <path d="M5 6l2 2-2 2"/>
    <path d="M8.5 10h2.5"/>
  </symbol>

  <!-- row actions -->
  <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 5.5h8v8h-8z"/>
    <path d="M10.5 5.5V2.5h-8v8h3"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 4.5H13"/>
    <path d="M6 4.5V2.5h4v2"/>
    <path d="M4.5 4.5v9h7v-9"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.5 2.5l2 2-8 8H3.5v-2z"/>
    <path d="M9.5 4.5l2 2"/>
  </symbol>
  <symbol id="i-filter" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 3.5h11l-4 5v4l-3 1.5V8.5z"/>
  </symbol>
  <symbol id="i-sort" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 4H13M3 8H9.5M3 12H6"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="3.5" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="8" cy="12.5" r="1"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8A4.5 4.5 0 0 1 12.5 8"/>
    <path d="M11 6.5L12.5 8L14 6.5"/>
    <path d="M12.5 8A4.5 4.5 0 0 1 3.5 8"/>
    <path d="M5 9.5L3.5 8L2 9.5"/>
  </symbol>
  <symbol id="i-undo" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 8a5.5 5.5 0 1 0 9-4.2"/>
    <path d="M11.5 2.25v1.55H9.2"/>
  </symbol>
  <symbol id="i-external" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 9v4.5h-11v-11H7"/>
    <path d="M9.5 2.5H13.5V6.5"/>
    <path d="M7.5 8.5L13.5 2.5"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.5v8"/>
    <path d="M4.5 7.5L8 11L11.5 7.5"/>
    <path d="M2.5 13.5H13.5"/>
  </symbol>
  <symbol id="i-upload" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 11V3"/>
    <path d="M4.5 6.5L8 3L11.5 6.5"/>
    <path d="M2.5 13.5H13.5"/>
  </symbol>

  <!-- status: the container carries the level, the mark carries the sense -->
  <symbol id="i-info" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.5"/>
    <path d="M8 7.5v3.5"/>
    <path d="M8 5h.01"/>
  </symbol>
  <symbol id="i-warning" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2.5L14 13.5H2z"/>
    <path d="M8 6.5v3"/>
    <path d="M8 11.5h.01"/>
  </symbol>
  <symbol id="i-error" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.5"/>
    <path d="M8 5v3.5"/>
    <path d="M8 10.75h.01"/>
  </symbol>
  <symbol id="i-success" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6.5"/>
    <path d="M5 8L7 10L11 6"/>
  </symbol>
</svg>

    <a class="skip-link" href="#mainCol">skip to content</a>

    <div class="layout">

        <div class="mobile-topbar">
            <div class="mobile-brand">meowmd</div>
            <div class="mobile-actions">
                <button class="btn btn-icon" data-theme-toggle aria-pressed="false" aria-label="switch to light theme">
                    <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
                    <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
                </button>
                <button class="hamburger" id="hamburger-btn" aria-label="open table of contents" aria-controls="sidebar"
                    aria-expanded="false">
                    <svg aria-hidden="true"><use href="#i-menu"/></svg>
                </button>
            </div>
        </div>

        <div class="mobile-modes">
            <div class="tabs-boxed-wrap" role="group" aria-label="view mode">
                <button class="tab-box active" type="button" data-mode="split" aria-pressed="true">split</button>
                <button class="tab-box" type="button" data-mode="markdown" aria-pressed="false">markdown</button>
                <button class="tab-box" type="button" data-mode="preview" aria-pressed="false">preview</button>
            </div>
        </div>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <nav class="navbar" id="navbar" aria-label="primary">
            <button class="btn btn-icon navbar-toggle" id="sidebarToggle" type="button"
                title="hide table of contents" aria-label="hide table of contents" aria-expanded="true"
                aria-controls="sidebar">
                <svg aria-hidden="true"><use href="#i-chevron-left"/></svg>
            </button>
            <div class="navbar-brand">
                <div class="logo-name">meowmd</div>
            </div>
            <div class="navbar-modes">
                <div class="tabs-boxed-wrap" role="group" aria-label="view mode">
                    <button class="tab-box active" type="button" data-mode="split" aria-pressed="true">split</button>
                    <button class="tab-box" type="button" data-mode="markdown" aria-pressed="false">markdown</button>
                    <button class="tab-box" type="button" data-mode="preview" aria-pressed="false">preview</button>
                </div>
            </div>
            <div class="navbar-title">
                <input type="text" id="titleInput" class="input title-input" placeholder="document title"
                    aria-label="document title" spellcheck="false" autocomplete="off">
            </div>
            <div class="navbar-actions">
                <button class="btn btn-icon" data-theme-toggle aria-pressed="false" aria-label="switch to light theme">
                    <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
                    <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
                </button>
                <button class="btn btn-icon" id="copyMdBtn" type="button" title="copy markdown" aria-label="copy markdown">
                    <svg aria-hidden="true"><use href="#i-copy"/></svg>
                </button>
                <button class="btn btn-icon" id="downloadMdBtn" type="button" title="download .md" aria-label="download markdown as .md file">
                    <svg aria-hidden="true"><use href="#i-download"/></svg>
                </button>
                <a class="btn btn-icon" href="https://github.com/uwuclxdy/meowmd" target="_blank" rel="noopener noreferrer"
                    title="view on github" aria-label="view on github">
                    <svg aria-hidden="true"><use href="#i-external"/></svg>
                </a>
            </div>
        </nav>

        <div class="workspace">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-nav">
                    <div class="nav-group" id="tocGroup">
                        <div class="nav-group-label">contents</div>
                        <div id="tocContent">
                            <p class="toc-empty">start typing to see headings...</p>
                        </div>
                    </div>
                </div>
            </div>

            <main class="main-col" id="mainCol" tabindex="-1">
                <div class="editor-wrap">
                <div class="editor-shell" id="editorContainer">
                    <div class="input-pane" id="inputPane">
                        <div class="pane-header">
                            <span class="label">markdown</span>
                            <span class="word-count" id="wordCount"></span>
                        </div>
                        <div class="editor-highlight-wrap">
                            <pre class="editor-highlight" id="editorHighlight" aria-hidden="true"><code class="language-markdown" id="editorHighlightCode"></code></pre>
                            <textarea id="markdownInput" class="markdown-input" spellcheck="false" placeholder="# markdown goes here~

## some stuff you can do
- **bold** and *italic* text
- [links](https://example.com)
- `code` and blocks
- > quotes, tables, lists

just start typing :3"></textarea>
                        </div>
                    </div>

                    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
                        title="drag to resize" tabindex="0"></div>

                    <div class="preview-pane" id="previewPane">
                        <div class="pane-header">
                            <span class="label">preview</span>
                            <div class="pane-header-actions">
                                <button class="btn btn-icon hidden" id="toggleWidthBtn" type="button" title="narrow preview"
                                    aria-label="narrow preview" aria-pressed="false">
                                    <svg aria-hidden="true"><use href="#i-chevron-left"/></svg>
                                </button>
                                <button class="btn btn-icon scroll-sync-toggle" id="scrollSyncBtn" type="button"
                                    title="sync editor and preview scroll" aria-label="sync editor and preview scroll"
                                    aria-pressed="false">
                                    <svg aria-hidden="true"><use href="#i-refresh"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="preview-content" id="previewContent"></div>
                    </div>
                </div>
                </div>
            </main>
        </div>
    </div>

    <button class="scroll-to-top" id="scrollToTop" type="button" title="back to top" aria-label="back to top">
        <svg aria-hidden="true"><use href="#i-chevron-up"/></svg>
    </button>

    <div class="toast-stack" id="toast-stack"></div>

    <script type="module" src="script.js"></script>
    <script type="module" src="cursor.js"></script>
    <script type="module" src="ui.js"></script>

</body>

</html>
